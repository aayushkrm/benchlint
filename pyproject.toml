[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "benchlint"
version = "0.1.0"
description = "A linter for ML benchmarks: finds train/test leakage, near-duplicates, label conflicts and shortcut features."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Kumar" }]
requires-python = ">=3.11"
keywords = ["benchmark", "contamination", "leakage", "evaluation", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "pydantic>=2",
    "typer",
    "pyyaml",
    "numpy",
    "scikit-learn",
    "datasketch",
    "pandas",
    "pyarrow",
    "huggingface_hub",
    "datasets",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
benchlint = "benchlint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/benchlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "model: needs a local model file; never run in CI (deselect with -m 'not model')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["datasketch", "datasketch.*", "sklearn", "sklearn.*", "datasets", "datasets.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
