# AuditSpec for stanfordnlp/snli (plain_text). Verified against the Hub on 2026-11-19: splits
# train (550152), validation (10000), test (10000); columns premise, hypothesis, label.
# Label -1 marks an item with no gold label and is dropped before sampling (drop_label_values).
# Train is capped at 100,000 rows (seeded) for CPU time (DECISION.md section 2.3).
# Known artifact: hypothesis-only baseline, E2 (literature value cited in docs/prereg.md).
# Licence: CC-BY-SA-4.0 (stated on the card; the corpus includes Flickr30k content).
dataset:
  name: snli
  source:
    kind: hf
    id_or_path: stanfordnlp/snli
    config: plain_text
    revision: null
    split_map: {train: train, validation: validation, test: test}
  text_fields: [premise, hypothesis]
  label_field: label
  id_field: null
  max_rows_per_split: 100000
  drop_label_values: [-1]
  seed: 0
checks:
  exact: true
  near: {threshold: 0.8, num_perm: 128, shingle: 5, lsh_threshold: 0.7}
  labels: true
  shortcut:
    views:
      - {name: hypothesis_only, kind: text_fields, fields: [hypothesis]}
      - {name: hypothesis_length, kind: length, fields: [hypothesis]}
    margin_pts: 10.0
    n_boot: 1000
    n_perm: 200
    max_rows: 100000
