# AuditSpec for allenai/ai2_arc, config ARC-Easy. Verified against the Hub on 2026-11-19:
# splits train (2251), test (2376), validation (570); columns id, question, choices, answerKey.
# Only the question text is audited; choices are a nested struct and are not in the text.
# Licence: CC-BY-SA-4.0 (Hub tag; the card itself says "more information needed").
dataset:
  name: arc-easy
  source:
    kind: hf
    id_or_path: allenai/ai2_arc
    config: ARC-Easy
    revision: null
    split_map: {train: train, test: test}
  text_fields: [question]
  label_field: answerKey
  id_field: id
  max_rows_per_split: null
  seed: 0
checks:
  exact: true
  near: {threshold: 0.8, num_perm: 128, shingle: 5, lsh_threshold: 0.7}
  labels: true
