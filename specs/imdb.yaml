# AuditSpec for stanfordnlp/imdb (plain_text). Verified against the Hub on 2026-11-19: splits
# train (25000), test (25000), unsupervised (50000, not audited); columns text and label.
# No id column. Licence: not stated on the card ("more information needed"); Hub tag "other";
# original release: Maas et al., 2011. benchlint does not redistribute the text.
dataset:
  name: imdb
  source:
    kind: hf
    id_or_path: stanfordnlp/imdb
    config: plain_text
    revision: null
    split_map: {train: train, test: test}
  text_fields: [text]
  label_field: label
  id_field: null
  max_rows_per_split: null
  seed: 0
checks:
  exact: true
  near: {threshold: 0.8, num_perm: 128, shingle: 5, lsh_threshold: 0.7}
  labels: true
