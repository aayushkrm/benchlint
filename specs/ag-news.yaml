# AuditSpec for fancyzhx/ag_news. Verified against the Hub on 2026-11-19: splits train (120000)
# and test (7600); columns text and label (4 classes). No id column.
# Used for the E1 calibration base (scripts/calibrate.py selects a seeded 2,000-item subset of
# the test split in code, not here) and for the E3 train/test leakage scan.
# Licence: not stated on the dataset card (Hub tag "unknown"). Original release: Zhang et al.,
# 2015. benchlint does not redistribute the text.
dataset:
  name: ag-news
  source:
    kind: hf
    id_or_path: fancyzhx/ag_news
    config: null
    revision: null
    split_map: {train: train, test: test}
  text_fields: [text]
  label_field: label
  id_field: null
  max_rows_per_split: null
  seed: 0
checks:
  exact: true
  near: {threshold: 0.8, num_perm: 128, shingle: 5, lsh_threshold: 0.7}
  labels: true
